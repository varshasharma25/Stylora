services:
  - type: web
    name: stylora-preview
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn --timeout 120 stylora.wsgi:application
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stylora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: stylora-db
    databaseName: stylora
    user: stylora_user
    plan: free
